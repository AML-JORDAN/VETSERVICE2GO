<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

<body>

    <button type="button" class="boton" id="btnIngresar">Iniciar sesión</button>

    <a class="enlace-inicio" href="index.html">← Volver al inicio</a>

  </main>

  <!-- El orden importa: primero la base de datos (Firebase), al final la pantalla -->
